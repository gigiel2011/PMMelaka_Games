<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SimCity 3D Master Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; background: #030712; font-family: sans-serif; color: #fff; overflow: hidden; }
        #app { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        #canvas-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas-container"></div>
        
        <header class="ui-layer p-3 m-3 rounded-2xl flex justify-between items-center shadow-lg">
            <div>
                <h1 class="font-black text-amber-400 text-sm">UrbanPlanner 3D</h1>
                <p class="text-[10px] text-slate-400">Pemain: <span id="hud-name" class="text-amber-300">Pemain</span></p>
            </div>
            <button onclick="openRegModal()" class="px-3 py-1.5 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Tukar Pemain</button>
        </header>

        <footer class="ui-layer p-3 m-3 rounded-2xl text-center text-xs">
            <span id="status-text">Sentuh zon pada grid 3D untuk mula merancang!</span>
        </footer>

        <!-- REGISTRATION MODAL -->
        <div id="modal-reg" class="absolute inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4">
            <div class="ui-layer p-6 rounded-3xl max-w-sm w-full text-center space-y-4 border-amber-400/40">
                <h2 class="text-xl font-black text-white">Daftar Pemain</h2>
                <input type="text" id="input-name" value="Pemain 1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-amber-300 font-bold outline-none" />
                <button type="button" onclick="confirmRegistrationAndStart()" class="w-full py-3 bg-amber-500 text-slate-950 font-black rounded-xl text-xs uppercase shadow-lg cursor-pointer">Mula Perancangan 3D</button>
            </div>
        </div>
    </div>

    <script>
        // Fungsi diletakkan secara global supaya boleh dibaca terus oleh onclick HTML
        function confirmRegistrationAndStart() {
            const name = document.getElementById('input-name').value.trim() || "Pemain";
            document.getElementById('hud-name').innerText = name;
            document.getElementById('modal-reg').classList.add('hidden');
        }

        function openRegModal() {
            document.getElementById('modal-reg').classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080d1a);
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 10);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const grid = new THREE.GridHelper(6, 6, 0xf59e0b, 0x334155);
            scene.add(grid);

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        });
    </script>
</body>
</html>
